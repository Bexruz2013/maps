<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApexMaps 3D Globe - Sun'iy Yo'ldosh & Navigatsiya</title>

  <!-- MapLibre GL 3.x CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617; /* Fazoviy to'q rang */
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Floating Search Panel */
    .search-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 380px;
      max-width: calc(100vw - 32px);
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      gap: 10px;
      height: 48px;
    }

    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: #ffffff;
      background: transparent;
    }

    .search-bar input::placeholder {
      color: #94a3b8;
    }

    .search-bar button {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .search-bar button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
    }

    /* Search Results */
    .search-results {
      max-height: 250px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }

    .search-results .item {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .search-results .item:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    /* Category Chips */
    .category-chips {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      overflow-x: auto;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .chip {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: #38bdf8;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
    }

    /* Route Panel */
    .route-panel {
      display: none;
      padding: 14px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-direction: column;
      gap: 10px;
    }

    .route-input-group {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 6px 10px;
      border-radius: 8px;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .route-input-group input {
      border: none;
      outline: none;
      background: transparent;
      width: 100%;
      font-size: 0.85rem;
      color: white;
    }

    .route-modes {
      display: flex;
      gap: 6px;
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }

    /* Right Controls Stack */
    .map-controls {
      position: absolute;
      right: 16px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-btn {
      width: 46px;
      height: 46px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      color: #e2e8f0;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: #0284c7;
      color: #ffffff;
      transform: scale(1.05);
    }

    .control-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Layer Selector Floating Card */
    .layers-card {
      position: absolute;
      right: 72px;
      bottom: 90px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 190px;
    }

    .layer-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .layer-opt:hover {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    /* Bottom Info Card */
    .place-card {
      position: absolute;
      bottom: 20px;
      left: 16px;
      z-index: 10;
      width: 380px;
      max-width: calc(100vw - 32px);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .place-card .title {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .place-card .subtitle {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .place-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .action-btn.primary { background: #0284c7; color: white; }
    .action-btn.secondary { background: rgba(255, 255, 255, 0.1); color: #cbd5e1; }

    /* Toast Notification */
    .toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0284c7;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Qidiruv va Navigatsiya Paneli -->
    <div class="search-panel">
      <div class="search-bar">
        <i class="fa-solid fa-earth-americas" style="color: #38bdf8;"></i>
        <input type="text" id="search-input" placeholder="Google Maps 3D bo'yicha qidirish..." />
        <button id="search-btn" title="Qidirish"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="toggle-route-btn" title="Yo'nalish"><i class="fa-solid fa-route"></i></button>
      </div>

      <div id="search-results" class="search-results"></div>

      <!-- Tezkor Obyektlar -->
      <div class="category-chips">
        <div class="chip" onclick="searchCategory('restaurant')"><i class="fa-solid fa-utensils"></i> Restoranlar</div>
        <div class="chip" onclick="searchCategory('hotel')"><i class="fa-solid fa-hotel"></i> Mehmonxonalar</div>
        <div class="chip" onclick="searchCategory('airport')"><i class="fa-solid fa-plane"></i> Aeroportlar</div>
        <div class="chip" onclick="searchCategory('gas station')"><i class="fa-solid fa-gas-station"></i> Zapravkalar</div>
      </div>

      <!-- Yo'nalish Paneli -->
      <div id="route-panel" class="route-panel">
        <div class="route-input-group">
          <i class="fa-solid fa-circle-dot" style="color:#10b981;"></i>
          <input type="text" id="route-from" placeholder="Boshlang'ich nuqta..." />
          <i class="fa-solid fa-crosshairs" id="set-my-start" style="cursor:pointer; color:#38bdf8;" title="Joylashuvim"></i>
        </div>
        <div class="route-input-group">
          <i class="fa-solid fa-location-dot" style="color:#ef4444;"></i>
          <input type="text" id="route-to" placeholder="Boriladigan joy..." />
        </div>
        <div class="route-modes">
          <button class="mode-btn active" data-mode="driving"><i class="fa-solid fa-car"></i> Mashina</button>
          <button class="mode-btn" data-mode="walking"><i class="fa-solid fa-person-walking"></i> Piyoda</button>
          <button class="mode-btn" data-mode="bicycling"><i class="fa-solid fa-bicycle"></i> Velosiped</button>
        </div>
        <button class="action-btn primary" id="calc-route-btn"><i class="fa-solid fa-directions"></i> Yo'nalishni chiqarish</button>
        <div id="route-info" style="display:none; justify-content:space-between; color:#38bdf8; font-size:0.85rem; font-weight:bold;">
          <span id="route-dist">- km</span>
          <span id="route-time">- min</span>
        </div>
      </div>
    </div>

    <!-- O'ng Tomondagi 3D va Qatlamlar Boshqaruvi -->
    <div class="map-controls">
      <button class="control-btn" id="btn-globe" title="3D Globus Rejimini Yoqish/O'chirish"><i class="fa-solid fa-globe"></i></button>
      <button class="control-btn" id="btn-3d" title="3D Kamera va Egnish (Tilt)"><i class="fa-solid fa-cube"></i></button>
      <button class="control-btn" id="btn-locate" title="Mening joylashuvim"><i class="fa-solid fa-location-crosshairs"></i></button>
      <button class="control-btn" id="btn-layers" title="Qatlamlar"><i class="fa-solid fa-layer-group"></i></button>
    </div>

    <!-- Qatlamlarni Tanlash Menyusi -->
    <div id="layers-card" class="layers-card">
      <div class="layer-opt" onclick="setLayer('satellite')">
        <i class="fa-solid fa-satellite"></i> Sun'iy Yo'ldosh (Satellite)
      </div>
      <div class="layer-opt" onclick="setLayer('hybrid')">
        <i class="fa-solid fa-map-marked-alt"></i> Sun'iy Yo'ldosh + Yo'llar
      </div>
      <div class="layer-opt" onclick="setLayer('vector')">
        <i class="fa-solid fa-map"></i> Standard Vektor 3D
      </div>
      <div class="layer-opt" onclick="setLayer('topo')">
        <i class="fa-solid fa-mountain"></i> Topo (Relyefli)
      </div>
    </div>

    <!-- Joy haqida Ma'lumot Kartasi -->
    <div id="place-card" class="place-card">
      <div class="title" id="place-title">Obyekt nomi</div>
      <div class="subtitle" id="place-sub">Koordinatalari va manzili</div>
      <div class="place-actions">
        <button class="action-btn primary" id="btn-route-here"><i class="fa-solid fa-route"></i> Bu yerga borish</button>
        <button class="action-btn secondary" id="btn-copy-coords"><i class="fa-solid fa-copy"></i> Nusxalash</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Map Container -->
    <div id="map"></div>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let map;
    let userLocation = null;
    let startCoords = null;
    let endCoords = null;
    let selectedCoords = null;
    let currentMarker = null;
    let travelMode = 'driving';
    let isGlobeProjection = true;
    let is3DTilt = false;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEvents();
    });

    function initMap() {
      // 3D Globus va Sun'iy yo'ldosh qatlamlari bilan map tayyorlash
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            'satellite-tiles': {
              type: 'raster',
              tiles: [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
              ],
              tileSize: 256,
              attribution: 'Esri World Imagery'
            },
            'osm-tiles': {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256
            },
            'topo-tiles': {
              type: 'raster',
              tiles: ['https://tile.opentopomap.org/{z}/{x}/{y}.png'],
              tileSize: 256
            }
          },
          layers: [
            {
              id: 'base-satellite',
              type: 'raster',
              source: 'satellite-tiles',
              minzoom: 0,
              maxzoom: 20
            },
            {
              id: 'base-osm',
              type: 'raster',
              source: 'osm-tiles',
              minzoom: 0,
              maxzoom: 19,
              layout: { visibility: 'none' }
            },
            {
              id: 'base-topo',
              type: 'raster',
              source: 'topo-tiles',
              minzoom: 0,
              maxzoom: 17,
              layout: { visibility: 'none' }
            }
          ]
        },
        center: [69.2401, 41.2995], // Toshkent
        zoom: 2.5, // Dastlab butun yer ko'rinadi (Globus)
        pitch: 0,
        bearing: 0
      });

      // 3D Yumaloq Yer (Globe) Proyeksiyasini yoqish
      map.on('style.load', () => {
        map.setProjection({
          type: 'globe'
        });
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');

      // Bosilganda marker va ma'lumot chiqarish
      map.on('click', (e) => {
        const { lng, lat } = e.lngLat;
        setMarker([lng, lat], "Tanlangan koordinata", `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
      });
    }

    function setupEvents() {
      // 3D Globus rejimi tugmasi
      document.getElementById('btn-globe').addEventListener('click', () => {
        isGlobeProjection = !isGlobeProjection;
        const btn = document.getElementById('btn-globe');
        
        if (isGlobeProjection) {
          map.setProjection({ type: 'globe' });
          map.flyTo({ zoom: 1.8, pitch: 0 });
          btn.classList.add('active');
          showToast("3D Globus rejimi yoqildi (Yumaloq Yer)");
        } else {
          map.setProjection({ type: 'mercator' });
          btn.classList.remove('active');
          showToast("Yassi 2D xaritalash rejimiga o'tildi");
        }
      });

      // 3D Egnish va Relyef ko'rinishi
      document.getElementById('btn-3d').addEventListener('click', () => {
        is3DTilt = !is3DTilt;
        const btn = document.getElementById('btn-3d');

        if (is3DTilt) {
          map.easeTo({ pitch: 65, bearing: -30, zoom: Math.max(map.getZoom(), 15), duration: 1200 });
          btn.classList.add('active');
          showToast("3D Kamera burchagi faollashdi");
        } else {
          map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
          btn.classList.remove('active');
          showToast("Standart kamera ko'rinishi");
        }
      });

      // Joylashuvni aniqlash
      document.getElementById('btn-locate').addEventListener('click', getUserLocation);

      // Qatlamlar menyusini ochish
      document.getElementById('btn-layers').addEventListener('click', () => {
        const card = document.getElementById('layers-card');
        card.style.display = card.style.display === 'flex' ? 'none' : 'flex';
      });

      // Search Box Event
      let timer;
      document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(timer);
        const q = e.target.value.trim();
        if (q.length > 2) {
          timer = setTimeout(() => searchPlaces(q), 400);
        } else {
          document.getElementById('search-results').style.display = 'none';
        }
      });

      document.getElementById('search-btn').addEventListener('click', () => {
        const q = document.getElementById('search-input').value.trim();
        if (q) searchPlaces(q);
      });

      document.getElementById('toggle-route-btn').addEventListener('click', () => {
        const panel = document.getElementById('route-panel');
        panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex';
      });

      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
          const t = e.currentTarget;
          t.classList.add('active');
          travelMode = t.dataset.mode;
        });
      });

      document.getElementById('set-my-start').addEventListener('click', () => {
        if (userLocation) {
          startCoords = userLocation;
          document.getElementById('route-from').value = "Mening joylashuvim";
          showToast("Boshlang'ich nuqta belgilandi.");
        } else {
          getUserLocation(() => {
            startCoords = userLocation;
            document.getElementById('route-from').value = "Mening joylashuvim";
          });
        }
      });

      document.getElementById('calc-route-btn').addEventListener('click', calculateRoute);

      document.getElementById('btn-copy-coords').addEventListener('click', () => {
        if (selectedCoords) {
          navigator.clipboard.writeText(`${selectedCoords[1]}, ${selectedCoords[0]}`);
          showToast("Koordinatalar nusxalandi!");
        }
      });

      document.getElementById('btn-route-here').addEventListener('click', () => {
        if (selectedCoords) {
          endCoords = selectedCoords;
          document.getElementById('route-to').value = document.getElementById('place-title').textContent;
          document.getElementById('route-panel').style.display = 'flex';
          showToast("Boriladigan manzil belgilandi!");
        }
      });
    }

    // Qatlamlarni almashtirish funksiyasi
    function setLayer(type) {
      const sat = 'base-satellite';
      const osm = 'base-osm';
      const topo = 'base-topo';

      map.setLayoutProperty(sat, 'visibility', 'none');
      map.setLayoutProperty(osm, 'visibility', 'none');
      map.setLayoutProperty(topo, 'visibility', 'none');

      if (type === 'satellite') {
        map.setLayoutProperty(sat, 'visibility', 'visible');
        showToast("Sun'iy yo'ldosh qatlami yoqildi");
      } else if (type === 'hybrid') {
        map.setLayoutProperty(sat, 'visibility', 'visible');
        map.setLayoutProperty(osm, 'visibility', 'visible');
        map.setPaintProperty(osm, 'raster-opacity', 0.4); // Shaffof yo'llar
        showToast("Gibrid (Yo'ldosh + Yo'llar) qatlami yoqildi");
      } else if (type === 'vector') {
        map.setLayoutProperty(osm, 'visibility', 'visible');
        map.setPaintProperty(osm, 'raster-opacity', 1);
        showToast("Vektor xarita yoqildi");
      } else if (type === 'topo') {
        map.setLayoutProperty(topo, 'visibility', 'visible');
        showToast("Relyefli Topo qatlam yoqildi");
      }

      document.getElementById('layers-card').style.display = 'none';
    }

    // Qidiruv Engine (Nominatim Global Data)
    async function searchPlaces(query) {
      const resultsDiv = document.getElementById('search-results');
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
        const data = await res.json();

        resultsDiv.innerHTML = '';
        if (data.length === 0) {
          resultsDiv.style.display = 'none';
          return;
        }

        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `<i class="fa-solid fa-location-dot" style="color:#38bdf8;"></i> <span>${item.display_name}</span>`;
          div.onclick = () => {
            const coords = [parseFloat(item.lon), parseFloat(item.lat)];
            setMarker(coords, item.display_name.split(',')[0], item.display_name);
            map.flyTo({ center: coords, zoom: 15, duration: 2000 });
            resultsDiv.style.display = 'none';
          };
          resultsDiv.appendChild(div);
        });

        resultsDiv.style.display = 'block';
      } catch (err) {
        console.error(err);
      }
    }

    function searchCategory(cat) {
      const center = map.getCenter();
      searchPlaces(`${cat} near ${center.lat},${center.lng}`);
      showToast(`${cat} bo'yicha qidiruv...`);
    }

    // Geolokatsiya
    function getUserLocation(cb) {
      if (!navigator.geolocation) {
        showToast("Geolokatsiya qo'llab-quvvatlanmaydi.");
        return;
      }
      showToast("Joylashuv aniqlanmoqda...");
      navigator.geolocation.getCurrentPosition(pos => {
        userLocation = [pos.coords.longitude, pos.coords.latitude];
        map.flyTo({ center: userLocation, zoom: 16, duration: 2500 });
        setMarker(userLocation, "Mening joylashuvim", "Joriy nuqtangiz");
        if (cb) cb();
      }, () => {
        showToast("Joylashuvni olishda xatolik.");
      });
    }

    // Marker qo'yish
    function setMarker(coords, title, subtitle) {
      selectedCoords = coords;
      if (currentMarker) currentMarker.remove();

      const el = document.createElement('div');
      el.className = 'custom-marker';
      el.innerHTML = `<i class="fa-solid fa-location-dot" style="font-size:36px; color:#ef4444; filter:drop-shadow(0 4px 8px rgba(0,0,0,0.6));"></i>`;

      currentMarker = new maplibregl.Marker({ element: el })
        .setLngLat(coords)
        .addTo(map);

      document.getElementById('place-title').textContent = title;
      document.getElementById('place-sub').textContent = subtitle;
      document.getElementById('place-card').style.display = 'flex';
    }

    // OSRM Routing Engine
    async function calculateRoute() {
      if (!startCoords || !endCoords) {
        showToast("Boshlang'ich va yakuniy nuqtalarni kiriting!");
        return;
      }

      showToast("Yo'nalish hisoblanmoqda...");

      const modeMap = { driving: 'driving', walking: 'walking', bicycling: 'bike' };
      const profile = modeMap[travelMode] || 'driving';
      const url = `https://router.project-osrm.org/route/v1/${profile}/${startCoords[0]},${startCoords[1]};${endCoords[0]},${endCoords[1]}?overview=full&geometries=geojson`;

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (!data.routes || data.routes.length === 0) {
          showToast("Yo'nalish topilmadi.");
          return;
        }

        const route = data.routes[0];
        const geojson = {
          type: 'Feature',
          geometry: route.geometry
        };

        if (map.getSource('route')) {
          map.getSource('route').setData(geojson);
        } else {
          map.addSource('route', {
            type: 'geojson',
            data: geojson
          });

          map.addLayer({
            id: 'route-line',
            type: 'line',
            source: 'route',
            layout: { 'line-join': 'round', 'line-cap': 'round' },
            paint: {
              'line-color': '#38bdf8',
              'line-width': 6,
              'line-opacity': 0.9
            }
          });
        }

        const coordinates = route.geometry.coordinates;
        const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
        map.fitBounds(bounds, { padding: 80 });

        document.getElementById('route-dist').textContent = `${(route.distance / 1000).toFixed(1)} km`;
        document.getElementById('route-time').textContent = `${Math.round(route.duration / 60)} min`;
        document.getElementById('route-info').style.display = 'flex';

      } catch (err) {
        showToast("Yo'nalishni hisoblashda xatolik.");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
