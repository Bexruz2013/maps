<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ApexMaps Ultra HD - Aniq Davlatlar va Ko'cha Nomlari</title>

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    html, body, #map {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    /* Qidiruv Paneli */
    .search-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      width: 380px;
      max-width: calc(100vw - 32px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .search-bar {
      display: flex;
      align-items: center;
      padding: 8px 14px;
      gap: 10px;
      height: 48px;
    }

    .search-bar input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 0.95rem;
      color: #ffffff;
      background: transparent;
    }

    .search-bar input::placeholder {
      color: #94a3b8;
    }

    .search-bar button {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1rem;
      padding: 6px;
      border-radius: 50%;
    }

    .search-bar button:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #38bdf8;
    }

    .search-results {
      max-height: 250px;
      overflow-y: auto;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: none;
    }

    .search-results .item {
      padding: 10px 16px;
      font-size: 0.85rem;
      color: #e2e8f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .search-results .item:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    /* Boshqaruv Tugmalari */
    .map-controls {
      position: absolute;
      right: 16px;
      bottom: 30px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .control-btn {
      width: 46px;
      height: 46px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      color: #e2e8f0;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: #0284c7;
      color: #ffffff;
      transform: scale(1.05);
    }

    .control-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    /* Qatlamlar Menyu Kartasi */
    .layers-card {
      position: absolute;
      right: 72px;
      bottom: 90px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 240px;
    }

    .layer-opt {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: #cbd5e1;
      cursor: pointer;
      padding: 8px;
      border-radius: 6px;
    }

    .layer-opt:hover {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }

    /* Geolokatsiya Indikatori */
    .user-location-marker {
      width: 22px;
      height: 22px;
      background: #007aff;
      border: 3px solid #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(0, 122, 255, 1);
      position: relative;
    }

    .user-location-marker::after {
      content: '';
      position: absolute;
      top: -9px;
      left: -9px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(0, 122, 255, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    .toast {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0284c7;
      color: white;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Qidiruv paneli -->
    <div class="search-panel">
      <div class="search-bar">
        <i class="fa-solid fa-earth-americas" style="color: #38bdf8;"></i>
        <input type="text" id="search-input" placeholder="Shahar, davlat yoki ko'chani qidiring..." />
        <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>

    <!-- O'ng tomondagi boshqaruv tugmalari -->
    <div class="map-controls">
      <button class="control-btn active" id="btn-globe" title="3D Yumaloq Yer / Yassi Rejim"><i class="fa-solid fa-globe"></i></button>
      <button class="control-btn" id="btn-3d" title="3D Perspektiva Rejimi"><i class="fa-solid fa-cube"></i></button>
      <button class="control-btn" id="btn-locate" title="Mening aniq joylashuvim"><i class="fa-solid fa-crosshairs"></i></button>
      <button class="control-btn" id="btn-layers" title="Qatlamlar Menyusi"><i class="fa-solid fa-layer-group"></i></button>
    </div>

    <!-- Qatlamlar oynasi -->
    <div id="layers-card" class="layers-card">
      <div class="layer-opt" onclick="switchLayer('hybrid-ultra')">
        <i class="fa-solid fa-satellite"></i> Ultra Tiniq Yo'ldosh + Nomlar
      </div>
      <div class="layer-opt" onclick="switchLayer('satellite-pure')">
        <i class="fa-solid fa-image"></i> Faqat Tiniq Sun'iy Yo'ldosh
      </div>
      <div class="layer-opt" onclick="switchLayer('street-hd')">
        <i class="fa-solid fa-map-location-dot"></i> HD Vektor (Barcha Nomlar)
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let map;
    let userMarker = null;
    let isGlobe = true;
    let is3D = false;

    document.addEventListener('DOMContentLoaded', () => {
      initMap();
      setupEvents();
      locateUser(true);
    });

    function initMap() {
      map = new maplibregl.Map({
        container: 'map',
        style: {
          version: 8,
          sources: {
            // Ultra Tiniq Esri World Imagery (HD Satellite)
            'satellite-hd': {
              type: 'raster',
              tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
              tileSize: 256,
              maxzoom: 19
            },
            // CartoDB Positron High-Res Places & Street Labels (Tiniq va o'qilishi oson matnlar)
            'carto-labels': {
              type: 'raster',
              tiles: ['https://basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png'],
              tileSize: 256,
              maxzoom: 19
            },
            // OpenStreetMap HD Full Vector Layer
            'osm-hd': {
              type: 'raster',
              tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
              tileSize: 256,
              maxzoom: 19
            }
          },
          layers: [
            {
              id: 'layer-sat',
              type: 'raster',
              source: 'satellite-hd',
              minzoom: 0,
              maxzoom: 20
            },
            {
              id: 'layer-labels',
              type: 'raster',
              source: 'carto-labels',
              minzoom: 0,
              maxzoom: 19
            },
            {
              id: 'layer-osm',
              type: 'raster',
              source: 'osm-hd',
              minzoom: 0,
              maxzoom: 19,
              layout: { visibility: 'none' }
            }
          ]
        },
        center: [69.2401, 41.2995], // Toshkent
        zoom: 2,
        pitch: 0,
        bearing: 0
      });

      // Yer sharini 3D Yumaloq shaklda ishga tushirish
      map.on('style.load', () => {
        map.setProjection({ type: 'globe' });
      });

      map.addControl(new maplibregl.NavigationControl({ showCompass: true }), 'bottom-right');
    }

    function setupEvents() {
      // 3D Globus / 2D Yassi rejim
      document.getElementById('btn-globe').addEventListener('click', () => {
        isGlobe = !isGlobe;
        const btn = document.getElementById('btn-globe');
        if (isGlobe) {
          map.setProjection({ type: 'globe' });
          map.flyTo({ zoom: 2 });
          btn.classList.add('active');
          showToast("3D Yumaloq Yer rejimi yoqildi");
        } else {
          map.setProjection({ type: 'mercator' });
          btn.classList.remove('active');
          showToast("2D Yassi xarita rejimi");
        }
      });

      // 3D Perspektiva
      document.getElementById('btn-3d').addEventListener('click', () => {
        is3D = !is3D;
        const btn = document.getElementById('btn-3d');
        if (is3D) {
          map.easeTo({ pitch: 60, bearing: -20, zoom: Math.max(map.getZoom(), 14), duration: 1000 });
          btn.classList.add('active');
          showToast("3D Perspektiva yoqildi");
        } else {
          map.easeTo({ pitch: 0, bearing: 0, duration: 1000 });
          btn.classList.remove('active');
          showToast("Standart tekis ko'rinish");
        }
      });

      // Aniq joylashuvni aniqlash
      document.getElementById('btn-locate').addEventListener('click', () => locateUser(false));

      // Qatlamlar oynasini almashtirish
      document.getElementById('btn-layers').addEventListener('click', () => {
        const card = document.getElementById('layers-card');
        card.style.display = card.style.display === 'flex' ? 'none' : 'flex';
      });

      // Qidiruv
      document.getElementById('search-btn').addEventListener('click', searchPlaces);
      document.getElementById('search-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchPlaces();
      });
    }

    // Geolokatsiya funksiyasi
    function locateUser(silent = false) {
      if (!navigator.geolocation) {
        if (!silent) showToast("Geolokatsiya qo'llab-quvvatlanmaydi.");
        return;
      }

      if (!silent) showToast("Joylashuv aniqlanmoqda...");

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const lng = pos.coords.longitude;
          const lat = pos.coords.latitude;

          if (userMarker) userMarker.remove();

          const el = document.createElement('div');
          el.className = 'user-location-marker';

          userMarker = new maplibregl.Marker({ element: el })
            .setLngLat([lng, lat])
            .setPopup(new maplibregl.Popup().setHTML("<b>Sizning aniq joylashuvngiz</b>"))
            .addTo(map);

          map.flyTo({ center: [lng, lat], zoom: 16, speed: 1.5 });
          if (!silent) showToast("Joylashuvingiz topildi!");
        },
        (err) => {
          if (!silent) showToast("Joylashuvni aniqlashga ruxsat berilmadi.");
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    // Qatlamlarni uzatish
    function switchLayer(mode) {
      const sat = 'layer-sat';
      const labels = 'layer-labels';
      const osm = 'layer-osm';

      if (mode === 'hybrid-ultra') {
        map.setLayoutProperty(sat, 'visibility', 'visible');
        map.setLayoutProperty(labels, 'visibility', 'visible');
        map.setLayoutProperty(osm, 'visibility', 'none');
        showToast("Ultra Tiniq Yo'ldosh + Aniq Nomlar");
      } else if (mode === 'satellite-pure') {
        map.setLayoutProperty(sat, 'visibility', 'visible');
        map.setLayoutProperty(labels, 'visibility', 'none');
        map.setLayoutProperty(osm, 'visibility', 'none');
        showToast("Tiniq Sun'iy Yo'ldosh (Nomlarsiz)");
      } else if (mode === 'street-hd') {
        map.setLayoutProperty(sat, 'visibility', 'none');
        map.setLayoutProperty(labels, 'visibility', 'none');
        map.setLayoutProperty(osm, 'visibility', 'visible');
        showToast("HD Vektor Xarita (Ko'cha va Shaharlar)");
      }
      document.getElementById('layers-card').style.display = 'none';
    }

    // Qidiruv Engine
    async function searchPlaces() {
      const query = document.getElementById('search-input').value.trim();
      const resultsDiv = document.getElementById('search-results');

      if (!query) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
        const data = await res.json();

        resultsDiv.innerHTML = '';
        if (data.length === 0) {
          showToast("Joy topilmadi.");
          resultsDiv.style.display = 'none';
          return;
        }

        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `<i class="fa-solid fa-location-dot" style="color:#38bdf8;"></i> <span>${item.display_name}</span>`;
          div.onclick = () => {
            const coords = [parseFloat(item.lon), parseFloat(item.lat)];
            map.flyTo({ center: coords, zoom: 15 });
            new maplibregl.Marker().setLngLat(coords).setPopup(new maplibregl.Popup().setHTML(`<b>${item.display_name}</b>`)).addTo(map);
            resultsDiv.style.display = 'none';
          };
          resultsDiv.appendChild(div);
        });

        resultsDiv.style.display = 'block';
      } catch (err) {
        showToast("Qidiruvda xatolik.");
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
